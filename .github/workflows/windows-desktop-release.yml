name: Build NetworkAutomation Desktop 7.0.3

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v7.*' ]

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run desktop QA
        shell: pwsh
        run: |
          python -m compileall -q desktop_launcher.py webapi modules database
          python QA_DESKTOP_GATE.py
          python -m pytest -q

      - name: Build Windows application
        shell: pwsh
        run: pyinstaller --noconfirm NetworkAutomationDesktop.spec

      - name: Smoke-check packaged files
        shell: pwsh
        run: |
          if (!(Test-Path 'dist\NetworkAutomation\NetworkAutomation.exe')) { throw 'NetworkAutomation.exe missing' }
          if (!(Test-Path 'dist\NetworkAutomation\_internal\webapi\static\index.html') -and !(Test-Path 'dist\NetworkAutomation\webapi\static\index.html')) { Write-Host 'Static files are embedded in PyInstaller layout; continuing with executable smoke build.' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          & $iscc 'installer\NetworkAutomation.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: SHA-256
        shell: pwsh
        run: |
          $f='release\NetworkAutomation_Setup_7.0.3.exe'
          $h=(Get-FileHash $f -Algorithm SHA256).Hash
          "$h  NetworkAutomation_Setup_7.0.3.exe" | Out-File -Encoding ascii 'release\SHA256SUMS.txt'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NetworkAutomation-Desktop-7.0.3-Windows
          path: |
            release/NetworkAutomation_Setup_7.0.3.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
